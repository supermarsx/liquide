[workspace]
resolver = "2"
members = [
    # Core protocol & transport
    "crates/liquide-common",
    "crates/liquide-protocol",
    "crates/liquide-transport",
    "crates/liquide-crypto",

    # Authentication & policy
    "crates/liquide-auth",
    "crates/liquide-policy",
    "crates/liquide-authorization",

    # Rendering & compositing
    "crates/liquide-simd",
    "crates/liquide-compositor",
    "crates/liquide-renderer-cpu",
    "crates/liquide-renderer-gpu",
    "crates/liquide-renderer-css",
    "crates/liquide-render-coordinator",
    "crates/liquide-encoder",
    "crates/liquide-encoder-hw",
    "crates/liquide-css",
    "crates/liquide-fonts",
    "crates/liquide-context-menu",
    "crates/liquide-dock",
    "crates/liquide-shell",
    "crates/liquide-cursor",
    "crates/liquide-cursor-vector",
    "crates/liquide-theme-css",
    "crates/liquide-animation",

    # GPU renderer (wgpu)
    "crates/liquide-renderer-wgpu",

    # Plugins & extensions
    "crates/liquide-plugin-host",
    "crates/liquide-plugin-abi",
    "crates/liquide-plugins",

    # Session management (binaries)
    "crates/liquide-session",
    "crates/liquide-session-manager",
    "crates/liquide-session-state",
    "crates/liquide-supervisor",

    # Client components
    "crates/liquide-client",
    "crates/liquide-client-renderer",
    "crates/liquide-mobile-core",

    # Media & streaming
    "crates/liquide-recording",
    "crates/liquide-assistance",
    "crates/liquide-audio",
    "crates/liquide-clipboard",
    "crates/liquide-usb",
    "crates/liquide-input",
    "crates/liquide-libinput",

    # Bluetooth
    "crates/liquide-bluetooth",

    # Desktop integration
    "crates/liquide-accounts",
    "crates/liquide-desktop-model",
    "crates/liquide-lockscreen",
    "crates/liquide-interop",
    "crates/liquide-a11y",
    "crates/liquide-a11y-bridge",
    "crates/liquide-a11y-prefs",
    "crates/liquide-platform",
    "crates/liquide-power",

    # UI toolkit & apps
    "crates/liquide-ui",
    "crates/liquide-ui-core",
    "crates/liquide-ui-widgets",
    "crates/liquide-ui-window",
    "crates/liquide-tooltip",
    "crates/liquide-popups",
    "crates/liquide-statusbar",
    "crates/liquide-tray",
    "crates/liquide-app-components",
    "crates/liquide-apps-terminal",
    "crates/liquide-apps-files",
    "crates/liquide-apps-settings",
    "crates/liquide-apps-text-editor",
    "crates/liquide-apps-software-center",
    "crates/liquide-apps-task-manager",

    # Infrastructure (binaries)
    "crates/liquide-gateway",
    "crates/liquide-manager",
    "crates/liquide-manager-frontend",
    "crates/liquide-ctl",
    "crates/liquide-telemetry-viewer",

    # Text engine
    "crates/liquide-text-engine",

    # IME & drag-drop
    "crates/liquide-ime",
    "crates/liquide-input-method",
    "crates/liquide-dnd",

    # Platform bridges
    "crates/liquide-bridge-gtk",
    "crates/liquide-bridge-qt",

    # Threaded rendering
    "crates/liquide-render-thread",

    # Font rasterizer bridge
    "crates/liquide-font-rasterizer",

    # Win32 platform integration
    "crates/liquide-platform-win32",

    # Testing & benchmarking
    "crates/liquide-bench",
    "crates/liquide-conformance",

    # CSS rendering pipeline
    "crates/liquide-dom",
    "crates/liquide-style-engine",
    "crates/liquide-layout",
    "crates/liquide-paint",
    "crates/liquide-hit-test",

    # Region-based invalidation & clipping
    "crates/liquide-region",

    # Shell components (templates)
    "crates/liquide-components",

    # Icon database
    "crates/liquide-icons",

    # Developer tools
    "crates/liquide-devtools",

    # System dialogs
    "crates/liquide-dialogs",

    # Network management
    "crates/liquide-network",

    # Firewall & network security
    "crates/liquide-firewall",

    # Focus & activation protocol
    "crates/liquide-focus",

    # Hotkey management
    "crates/liquide-hotkeys",

    # Gesture recognition
    "crates/liquide-gestures",

    # Screenshot capture & annotation
    "crates/liquide-screenshot",

    # Shared memory (zero-copy compositing)
    "crates/liquide-shm",

    # Settings / preferences
    "crates/liquide-settings",

    # Window effects & transitions
    "crates/liquide-window-effects",

    # Compositor-driven animations (transform/opacity on render thread)
    "crates/liquide-compositor-anim",

    # Search / file indexing
    "crates/liquide-search",

    # Cursor themes
    "crates/liquide-cursor-theme",

    # Window class registration
    "crates/liquide-window-class",

    # Window tree (hierarchy & z-order)
    "crates/liquide-window-tree",

    # Window grouping & tab groups
    "crates/liquide-window-groups",

    # Overview & window switcher
    "crates/liquide-overview",

    # Virtual workspaces
    "crates/liquide-workspaces",

    # Window tiling manager
    "crates/liquide-tiling",

    # Clipboard manager (history, pinning, multi-format)
    "crates/liquide-clipboard-manager",

    # DPI / scaling support
    "crates/liquide-dpi",

    # Display / output management
    "crates/liquide-display",

    # DRM/KMS display output
    "crates/liquide-drm",

    # Keyboard layout management
    "crates/liquide-keyboard",

    # Theme engine
    "crates/liquide-theme-engine",

    # Notification daemon
    "crates/liquide-notification-daemon",

    # Print system
    "crates/liquide-print",

    # Internationalization & locale management
    "crates/liquide-locale",

    # Disk & storage device management
    "crates/liquide-storage",

    # Scheduled task management
    "crates/liquide-scheduler",

    # Autostart management
    "crates/liquide-autostart",

    # XDG desktop standards
    "crates/liquide-xdg",

    # Desktop sound effects
    "crates/liquide-sounds",

    # Date, time, timezone & clock management
    "crates/liquide-datetime",

    # System font management & discovery
    "crates/liquide-font-manager",

    # Message queue (per-thread)
    "crates/liquide-message-queue",

    # Property trees (compositing, hit testing, damage tracking)
    "crates/liquide-property-tree",

    # Tile-based incremental rasterization
    "crates/liquide-tile-raster",

    # Layout constraint caching
    "crates/liquide-layout-cache",

    # Compositor layer system
    "crates/liquide-layers",

    # Scrolling system (smooth, momentum, snap)
    "crates/liquide-scroll",

    # Keyboard shortcut customization
    "crates/liquide-shortcut-manager",

    # Wayland protocol abstraction
    "crates/liquide-wayland",

    # Wayland compositor server
    "crates/liquide-wayland-server",

    # Service lifecycle manager
    "crates/liquide-service-manager",

    # GBM buffer management
    "crates/liquide-gbm",

    # Logind session/VT management
    "crates/liquide-logind",

    # XWayland integration
    "crates/liquide-xwayland",

    # Standalone compositor (TTY launch)
    "crates/liquide-standalone",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/liquide/liquide"
rust-version = "1.85"

[workspace.dependencies]
# Local crates
liquide-cursor = { path = "crates/liquide-cursor" }
liquide-ui-core = { path = "crates/liquide-ui-core" }
liquide-ui-widgets = { path = "crates/liquide-ui-widgets" }
liquide-ui-window = { path = "crates/liquide-ui-window" }
liquide-tooltip = { path = "crates/liquide-tooltip" }
liquide-statusbar = { path = "crates/liquide-statusbar" }
liquide-app-components = { path = "crates/liquide-app-components" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ciborium = "0.2"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto & TLS
rustls = "0.23"
tokio-rustls = "0.26"
quinn = "0.11"
tokio-tungstenite = "0.24"
rcgen = "0.13"
rustls-pemfile = "2"

# Compression
zstd = "0.13"
lz4_flex = "0.11"
miniz_oxide = "0.8"

# GPU
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }

# Concurrency
crossbeam-channel = "0.5"
rayon = "1.10"

# Metrics
metrics = "0.24"

# Bitflags
bitflags = "2"

# Bytes & I/O
bytes = "1"
futures-util = "0.3"
socket2 = "0.5"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Directories
dirs = "6"

# Font rendering
ab_glyph = "0.2"
rustybuzz = "0.20"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
tempfile = "3"

# Internal crates
liquide-common = { path = "crates/liquide-common" }
liquide-protocol = { path = "crates/liquide-protocol" }
liquide-transport = { path = "crates/liquide-transport" }
