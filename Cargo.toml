[workspace]
resolver = "2"
members = [
    # Core protocol & transport
    "crates/liquide-common",
    "crates/liquide-protocol",
    "crates/liquide-transport",
    "crates/liquide-crypto",

    # Authentication & policy
    "crates/liquide-auth",
    "crates/liquide-policy",

    # Rendering & compositing
    "crates/liquide-compositor",
    "crates/liquide-renderer-cpu",
    "crates/liquide-renderer-gpu",
    "crates/liquide-renderer-css",
    "crates/liquide-render-coordinator",
    "crates/liquide-encoder",
    "crates/liquide-encoder-hw",
    "crates/liquide-css",
    "crates/liquide-fonts",
    "crates/liquide-context-menu",
    "crates/liquide-dock",
    "crates/liquide-shell",
    "crates/liquide-cursor",
    "crates/liquide-cursor-vector",
    "crates/liquide-theme-css",

    # Plugins & extensions
    "crates/liquide-plugin-host",
    "crates/liquide-plugin-abi",

    # Session management (binaries)
    "crates/liquide-session",
    "crates/liquide-supervisor",

    # Client components
    "crates/liquide-client",
    "crates/liquide-client-renderer",
    "crates/liquide-mobile-core",

    # Media & streaming
    "crates/liquide-recording",
    "crates/liquide-assistance",
    "crates/liquide-audio",
    "crates/liquide-clipboard",
    "crates/liquide-usb",
    "crates/liquide-input",

    # Desktop integration
    "crates/liquide-interop",
    "crates/liquide-a11y",
    "crates/liquide-platform",

    # UI toolkit & apps
    "crates/liquide-ui",
    "crates/liquide-ui-core",
    "crates/liquide-ui-widgets",
    "crates/liquide-ui-window",
    "crates/liquide-tooltip",
    "crates/liquide-statusbar",
    "crates/liquide-apps-terminal",
    "crates/liquide-apps-files",
    "crates/liquide-apps-settings",
    "crates/liquide-apps-text-editor",
    "crates/liquide-apps-software-center",
    "crates/liquide-apps-task-manager",

    # Infrastructure (binaries)
    "crates/liquide-gateway",
    "crates/liquide-manager",
    "crates/liquide-manager-frontend",
    "crates/liquide-ctl",
    "crates/liquide-telemetry-viewer",

    # Testing & benchmarking
    "crates/liquide-bench",
    "crates/liquide-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/liquide/liquide"
rust-version = "1.85"

[workspace.dependencies]
# Local crates
liquide-cursor = { path = "crates/liquide-cursor" }
liquide-ui-core = { path = "crates/liquide-ui-core" }
liquide-ui-widgets = { path = "crates/liquide-ui-widgets" }
liquide-ui-window = { path = "crates/liquide-ui-window" }
liquide-tooltip = { path = "crates/liquide-tooltip" }
liquide-statusbar = { path = "crates/liquide-statusbar" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto & TLS
rustls = "0.23"
tokio-rustls = "0.26"
quinn = "0.11"
tokio-tungstenite = "0.24"
rcgen = "0.13"
rustls-pemfile = "2"

# Compression
zstd = "0.13"
lz4_flex = "0.11"

# Bitflags
bitflags = "2"

# Bytes & I/O
bytes = "1"
futures-util = "0.3"
socket2 = "0.5"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Directories
dirs = "6"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
liquide-common = { path = "crates/liquide-common" }
liquide-protocol = { path = "crates/liquide-protocol" }
liquide-transport = { path = "crates/liquide-transport" }
liquide-crypto = { path = "crates/liquide-crypto" }
liquide-auth = { path = "crates/liquide-auth" }
liquide-policy = { path = "crates/liquide-policy" }
liquide-compositor = { path = "crates/liquide-compositor" }
liquide-renderer-cpu = { path = "crates/liquide-renderer-cpu" }
liquide-renderer-gpu = { path = "crates/liquide-renderer-gpu" }
liquide-renderer-css = { path = "crates/liquide-renderer-css" }
liquide-theme-css = { path = "crates/liquide-theme-css" }
liquide-encoder = { path = "crates/liquide-encoder" }
liquide-encoder-hw = { path = "crates/liquide-encoder-hw" }
liquide-css = { path = "crates/liquide-css" }
liquide-fonts = { path = "crates/liquide-fonts" }
liquide-context-menu = { path = "crates/liquide-context-menu" }
liquide-dock = { path = "crates/liquide-dock" }
liquide-shell = { path = "crates/liquide-shell" }
liquide-plugin-host = { path = "crates/liquide-plugin-host" }
liquide-plugin-abi = { path = "crates/liquide-plugin-abi" }
liquide-session = { path = "crates/liquide-session" }
liquide-supervisor = { path = "crates/liquide-supervisor" }
liquide-client = { path = "crates/liquide-client" }
liquide-client-renderer = { path = "crates/liquide-client-renderer" }
liquide-mobile-core = { path = "crates/liquide-mobile-core" }
liquide-recording = { path = "crates/liquide-recording" }
liquide-assistance = { path = "crates/liquide-assistance" }
liquide-audio = { path = "crates/liquide-audio" }
liquide-clipboard = { path = "crates/liquide-clipboard" }
liquide-usb = { path = "crates/liquide-usb" }
liquide-input = { path = "crates/liquide-input" }
liquide-interop = { path = "crates/liquide-interop" }
liquide-platform = { path = "crates/liquide-platform" }
liquide-a11y = { path = "crates/liquide-a11y" }
liquide-ui = { path = "crates/liquide-ui" }
liquide-gateway = { path = "crates/liquide-gateway" }
liquide-manager = { path = "crates/liquide-manager" }
liquide-manager-frontend = { path = "crates/liquide-manager-frontend" }
liquide-ctl = { path = "crates/liquide-ctl" }
liquide-bench = { path = "crates/liquide-bench" }
liquide-conformance = { path = "crates/liquide-conformance" }
liquide-render-coordinator = { path = "crates/liquide-render-coordinator" }
liquide-cursor-vector = { path = "crates/liquide-cursor-vector" }

[profile.dev]
opt-level = 0
debug = true

# Render-critical crates get optimised even in debug builds so that
# fill_rect, blur, and scene flattening are usable at interactive rates.
[profile.dev.package.liquide-renderer-cpu]
opt-level = 2
[profile.dev.package.liquide-compositor]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
