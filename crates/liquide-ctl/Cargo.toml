[package]
name = "liquide-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "liquidctl — Unified CLI tool for administering, monitoring, and troubleshooting LiquiDE servers"

[[bin]]
name = "liquidctl"
path = "src/main.rs"

[dependencies]
# Workspace deps
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive", "env", "wrap_help", "string"] }

# Crate-specific deps
clap_complete = "4"
colored = "2"
tabled = "0.17"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
csv = "1"
comfy-table = "7"
dialoguer = "0.11"
indicatif = "0.17"
humantime = "2"
bytesize = "1"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
