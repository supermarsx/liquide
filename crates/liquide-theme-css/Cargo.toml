[package]
name = "liquide-theme-css"
version = "0.1.0"
edition = "2024"
authors = ["Liquide Contributors"]
description = "CSS parser and theme engine for Liquide desktop"
license = "MIT OR Apache-2.0"

[dependencies]
# CSS parsing
lightningcss = { version = "1.0.0-alpha.70", features = ["serde"] }
cssparser = "0.33"

# Color handling
csscolorparser = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# File watching
notify = "7.0"

# Logging
tracing = "0.1"

# Regex for selectors
regex = "1.11"

# Path handling
glob = "0.3"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"

# Example disabled until implemented
# [[example]]
# name = "parse_theme"
