[package]
name = "liquide-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
liquide-compositor.workspace = true
liquide-context-menu.workspace = true
liquide-dock.workspace = true
liquide-input.workspace = true
liquide-interop.workspace = true
liquide-platform.workspace = true
liquide-platform-win32.workspace = true
liquide-ui.workspace = true
liquide-theme-css = { path = "../liquide-theme-css" }
liquide-renderer-css.workspace = true
liquide-dom.workspace = true
liquide-style-engine.workspace = true
liquide-layout.workspace = true
liquide-paint.workspace = true
liquide-hit-test.workspace = true
liquide-components.workspace = true
liquide-statusbar = { path = "../liquide-statusbar" }
liquide-font-rasterizer.workspace = true
liquide-animation = { path = "../liquide-animation" }
# ── Canonical chrome crates (t51 mandate 2; dormant scaffolding in C0) ──
liquide-workspaces = { path = "../liquide-workspaces" }
liquide-tiling.workspace = true
liquide-window-tree.workspace = true
liquide-window-groups = { path = "../liquide-window-groups" }
liquide-window-class = { path = "../liquide-window-class" }
liquide-window-effects = { path = "../liquide-window-effects" }
liquide-lockscreen = { path = "../liquide-lockscreen" }
liquide-dialogs = { path = "../liquide-dialogs" }
liquide-tooltip.workspace = true
liquide-notification-daemon = { path = "../liquide-notification-daemon" }
liquide-shell-services.workspace = true
# Supports shell-services consumption (DesktopEntry for app registration; t51-e10).
liquide-xdg.workspace = true
# WidgetId for the canonical tooltip manager hover slot (t51-e9 tooltip adapter).
liquide-ui-core.workspace = true
# Cursor CSS seam: the shell resolves `cursor { color }` from CSS and exposes a
# `CursorTheme` for the host to feed `SoftwareRenderer::set_cursor_theme`
# (t64-p0 Primitive 4 / t73-shell). No dependency cycle: renderer-cpu does not
# depend on liquide-shell.
liquide-renderer-cpu.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
serde_json = "1"
liquide-font-rasterizer.workspace = true

[[bench]]
name = "shell_bench"
harness = false
