[package]
name = "liquide-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
liquide-compositor.workspace = true
liquide-context-menu.workspace = true
liquide-dock.workspace = true
liquide-input.workspace = true
liquide-interop.workspace = true
liquide-platform.workspace = true
# Multi-monitor foundation (t73-multimon §3): the shell consumes
# `DesktopLayout` / `WorkAreaInsets` to place chrome per-monitor, reserve work
# areas, and make MoveToMonitor real. Previously unconsumed (t63 §2).
liquide-display.workspace = true
# Input-plane foundations (t73-input): the shell drives the IME engine on the
# keyboard path (CJK/accent/emoji) and folds the canonical global-hotkey binding
# model into its ShortcutManager. Both are byte-compatible with liquide-input's
# Modifiers per t73-input.
liquide-input-method = { path = "../liquide-input-method" }
liquide-hotkeys = { path = "../liquide-hotkeys" }
liquide-platform-win32.workspace = true
liquide-ui.workspace = true
liquide-theme-css = { path = "../liquide-theme-css" }
liquide-renderer-css.workspace = true
liquide-dom.workspace = true
liquide-style-engine.workspace = true
liquide-layout.workspace = true
liquide-paint.workspace = true
liquide-hit-test.workspace = true
liquide-components.workspace = true
# P8 full-CSS app content (t108): the shell bridges the toolkit-free
# `liquide-interop::AppWidgetModel` into real `liquide-widgets` Components and
# drives a per-window `WidgetHost` so app UIs render + interact through DOM/CSS.
liquide-widgets.workspace = true
# Embedded-runtime hosts (t152): a WasmApp / ScriptApp model node mounts the UI
# emitted by a sandboxed WASM (wasmtime) or TS/JS (boa+swc) module through the
# SAME widget pipeline. The heavy runtimes are opt-in: under the default build
# these resolve to the crates' Null* hosts (which report `Unavailable`, so the
# mapper shows a graceful "runtime unavailable" placeholder); enabling the
# shell's `wasm-apps` / `script-apps` features turns on the real runtimes.
liquide-wasm-host.workspace = true
liquide-script-host.workspace = true
# Silent <video> element (t155): a `Video` model node mounts a video surface
# whose RGBA frames come from a pure-Rust AV1 decoder (`liquide-video`). The
# heavy decoder (rav1d) is opt-in: under the default build this resolves to the
# crate's `NullVideoSource` (reports `Unavailable`, so the mapper shows a "video
# unavailable / no codec" placeholder); enabling the shell's `video` feature
# turns on the real decoder.
liquide-video.workspace = true
# OpenStreetMap slippy-map element (t159): a `Map` model node mounts a tiled map
# surface — `liquide-map` computes the visible tiles' screen rects + image keys
# (pure Web-Mercator math, no network) and the shell emits them as positioned
# Image nodes. Tile FETCH is opt-in via `liquide-map/net` (behind the shell's
# `map` feature → `liquide-http/net`); the default build does the tile MATH only
# and paints a placeholder grid + "offline" notice (no reqwest/tokio pulled in).
liquide-map.workspace = true
liquide-statusbar = { path = "../liquide-statusbar" }
liquide-font-rasterizer.workspace = true
liquide-animation = { path = "../liquide-animation" }
# ── Canonical chrome crates (t51 mandate 2; dormant scaffolding in C0) ──
liquide-workspaces = { path = "../liquide-workspaces" }
liquide-tiling.workspace = true
liquide-window-tree.workspace = true
liquide-window-groups = { path = "../liquide-window-groups" }
liquide-window-class = { path = "../liquide-window-class" }
liquide-window-effects = { path = "../liquide-window-effects" }
liquide-lockscreen = { path = "../liquide-lockscreen" }
liquide-dialogs = { path = "../liquide-dialogs" }
liquide-tooltip.workspace = true
liquide-notification-daemon = { path = "../liquide-notification-daemon" }
liquide-shell-services.workspace = true
# Supports shell-services consumption (DesktopEntry for app registration; t51-e10).
liquide-xdg.workspace = true
# WidgetId for the canonical tooltip manager hover slot (t51-e9 tooltip adapter).
liquide-ui-core.workspace = true
# Cursor CSS seam: the shell resolves `cursor { color }` from CSS and exposes a
# `CursorTheme` for the host to feed `SoftwareRenderer::set_cursor_theme`
# (t64-p0 Primitive 4 / t73-shell). No dependency cycle: renderer-cpu does not
# depend on liquide-shell.
liquide-renderer-cpu.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Default build: NO heavy runtimes. The WasmApp / ScriptApp model nodes still
# wire up — they instantiate the host crates' Null* stubs, so they render a
# graceful "runtime unavailable" placeholder instead of crashing or pulling in
# wasmtime / boa+swc.
default = []
# Opt into the real sandboxed WASM runtime (wasmtime) for `WasmApp` nodes.
wasm-apps = ["liquide-wasm-host/wasm"]
# Opt into the real sandboxed TS/JS runtime (boa+swc) for `ScriptApp` nodes.
script-apps = ["liquide-script-host/script"]
# Opt into the real pure-Rust AV1 decoder (rav1d) for `Video` nodes.
video = ["liquide-video/video"]
# Opt into real OSM tile FETCHING (liquide-http/net) for `Map` nodes. Off by
# default: the map still does all the tile MATH and emits positioned tiles, but
# paints the placeholder grid until tiles are fetched + decoded by the session.
map = ["liquide-map/net"]

[dev-dependencies]
criterion.workspace = true
serde_json = "1"
liquide-font-rasterizer.workspace = true
# t176-damage-confine: the precomputed-damage SUPERSET teeth proof renders each
# newly-confined frame TWICE through the real CPU rasterizer — once with the
# confined damage, once full — and asserts the framebuffers are pixel-identical.
# renderer-cpu does not depend on liquide-shell, so this dev-dep adds no cycle.
liquide-renderer-cpu.workspace = true

[[bench]]
name = "shell_bench"
harness = false
