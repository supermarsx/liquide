[package]
name = "liquide-cursor-vector"
version = "0.1.0"
edition = "2024"
authors = ["Liquide Contributors"]
description = "High-definition vector cursor rendering for Liquide"
license = "MIT OR Apache-2.0"

[dependencies]
# SVG parsing and rendering
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"

# XML parsing for SVG
roxmltree = "0.20"

# Image handling
image = { version = "0.25", features = ["png", "jpeg"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "2.0"

# Cursor crate integration
liquide-cursor = { path = "../liquide-cursor" }

# Font rendering for text cursors
fontdb = "0.22"

# Logging
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vector_rendering"
harness = false
