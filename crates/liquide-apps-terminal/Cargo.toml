[package]
name = "liquide-apps-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Built-in terminal emulator for the LiquiDE desktop environment"

[lib]
name = "liquide_apps_terminal"
path = "src/lib.rs"

[[bin]]
name = "liquid-terminal"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

liquide-app-harness = { path = "../liquide-app-harness" }
liquide-ui-core = { path = "../liquide-ui-core" }
liquide-ui-widgets = { path = "../liquide-ui-widgets" }
liquide-ime = { path = "../liquide-ime" }

unicode-width = "0.2"
