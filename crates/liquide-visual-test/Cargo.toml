[package]
name = "liquide-visual-test"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless deterministic capture + golden-image regression harness for the Liquide desktop"

[lib]
name = "liquide_visual_test"
path = "src/lib.rs"

# Fast eyeball-debug loop: render the current desktop to a PNG on demand.
# Wired into scripts/dev/dev.{ps1,sh} as the `snapshot` task (t56-f7).
[[bin]]
name = "snapshot"
path = "src/bin/snapshot.rs"

# Per-stage CPU render-path frame-time benchmark (t75-bench). Measures the real
# boot->pixels path (build_scene -> flatten -> raster) at 1920x1080 by calling
# the existing public APIs; prints a per-stage table + derived fps.
[[bin]]
name = "render_bench"
path = "src/bin/render_bench.rs"

# HONEST end-to-end LIVE frame-time harness (t97). Unlike render_bench (raster
# only), this faithfully reconstructs the live render worker's WHOLE per-frame
# sequence from public APIs (build_scene + drain precomputed damage + flatten +
# render_live + content_hash_damaged + tile-hash trim + snapshot recycle +
# present-rect prep) and reports median/p95 ms + fps per live scenario.
[[bin]]
name = "frame_time_harness"
path = "src/bin/frame_time_harness.rs"

# EXTENSIVE per-operation LIVE frame-time harness (t161). Fixes the t97 harness's
# cross-frame-state bug: keeps ONE Shell + Compositor + renderer + persistent
# retained-flatten / tile-hash / snapshot-recycler / framebuffer alive across
# EVERY frame (warmed exactly like the live render_full_job worker), and reports
# median/p95 ms + fps + per-stage attribution for EVERY DE operation (idle,
# cursor, clock, hover, menu, window drag-move, resize-drag, scroll, typing,
# window open/close, workspace switch, theme switch, full-frame).
[[bin]]
name = "perf_ops"
path = "src/bin/perf_ops.rs"

[dependencies]
# CPU rasterizer (SoftwareRenderer) for the raster stage of the render_bench bin.
liquide-renderer-cpu.workspace = true
# Font database wiring for the renderer (mirrors DesktopCompositor font load).
liquide-font-rasterizer.workspace = true
# Drives the REAL desktop compositor headlessly (capture_once seam).
liquide-session.workspace = true
# StandalonePlatform backend + PlatformEvent scripting + StandalonePresentedFrame.
liquide-platform.workspace = true
# PixelFormat used by CapturedFrame.
liquide-compositor.workspace = true
# MouseEvent / MouseButton / ButtonState for scripted scenario input (t56-f7).
liquide-input.workspace = true
# Shell handle for direct chrome-state drive (notifications/dialogs/center toggle)
# in scenario builders that have no PlatformEvent trigger (t57-e1 / A0).
liquide-shell.workspace = true
# Notification value object for the notification_shown scenario builder.
liquide-interop.workspace = true
# TemplateNode + HTML fragment parsing for the primitive-render capability
# harness (test-harden): mounts author-supplied HTML/CSS onto a clean canvas
# and drives the real Shell pipeline so capability goldens have full teeth.
liquide-components.workspace = true
# PNG encode/decode for goldens, diffs, and snapshot output.
image = { version = "0.25", features = ["png"] }
tracing.workspace = true

[dev-dependencies]
# Canonical tooltip config, so the e2e responsiveness suite reads the live
# `TooltipConfig::default()` dwell budget (show_delay_ms + fade_in_ms) instead of
# hardcoding it — the budget then tracks the config automatically (t77-RESP).
liquide-tooltip.workspace = true
