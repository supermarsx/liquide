[package]
name = "liquide-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Network gateway that terminates remote client connections and routes them to sessions"

[lib]
name = "liquide_gateway"
path = "src/lib.rs"

[[bin]]
name = "liquid-gateway"
path = "src/main.rs"

[dependencies]
liquide-common.workspace = true
liquide-protocol.workspace = true
liquide-transport.workspace = true
liquide-crypto.workspace = true
liquide-auth.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
rustls = { workspace = true, features = ["ring"] }
tokio-rustls.workspace = true
ciborium.workspace = true
rustls-pemfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen.workspace = true
