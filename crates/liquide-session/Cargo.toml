[package]
name = "liquide-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-user session process for the Liquide desktop environment"

[lib]
name = "liquide_session"
path = "src/lib.rs"

[[bin]]
name = "liquid-session"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
liquide-common.workspace = true
liquide-authz-runtime.workspace = true
# t67-authz-wire: the session authz plane wraps the power backend in
# `GatedPowerManager` (spec §3.2). `liquide-power` has no workspace.dependencies
# entry yet and the root manifest is out of this executor's lock, so it is
# pulled in via a direct path dependency (mirrors this crate's path dev-deps).
liquide-power = { path = "../liquide-power" }
liquide-protocol.workspace = true
liquide-transport.workspace = true
liquide-compositor.workspace = true
liquide-cursor.workspace = true
liquide-cursor-vector.workspace = true
liquide-renderer-cpu.workspace = true
liquide-font-rasterizer.workspace = true
liquide-encoder.workspace = true
liquide-shell.workspace = true
# t95-p3 (t86 full-CSS P3): the pre-shell loading-screen mini-pipeline parses an
# embedded loading.html into a `liquide_dom::Document` and runs it through the
# shell's `DesktopPipeline`. liquide-dom was previously a dev-dep only; the
# loading mini-pipeline needs it in the main build.
liquide-dom.workspace = true
# t131-devtools-p2: the separate devtools window (dev-mode only) renders the
# devtools UI through its own CSS mini-pipeline and routes its pointer events to
# the panel via a hit-test over the window's own layout — needing the style /
# layout / hit-test / template types directly in the main build (previously some
# were dev-deps or pulled transitively only).
liquide-style-engine.workspace = true
liquide-layout.workspace = true
liquide-hit-test.workspace = true
liquide-components.workspace = true
liquide-theme-css.workspace = true
liquide-plugin-host.workspace = true
liquide-input.workspace = true
liquide-platform.workspace = true
# Multi-monitor foundation (t73-multimon §3.1): the session reads the platform
# monitor set and builds the `liquide_display::DesktopLayout` it hands to the
# shell. Previously unconsumed (t63 §2).
liquide-display.workspace = true
liquide-clipboard.workspace = true
liquide-audio.workspace = true
liquide-interop.workspace = true
# t70-s6: the SESSION host links the six built-in app crates so it can construct
# their `dyn AppView` and register it against each opened window (the shell stays
# app-agnostic — it only knows the `AppView` trait via liquide-interop). These
# are path deps (not `[workspace.dependencies]`) to keep the change inside the
# host's lock and off the root manifest, mirroring the `liquide-power` path dep.
liquide-apps-terminal = { path = "../liquide-apps-terminal" }
liquide-apps-text-editor = { path = "../liquide-apps-text-editor" }
liquide-apps-files = { path = "../liquide-apps-files" }
liquide-apps-settings = { path = "../liquide-apps-settings" }
liquide-apps-task-manager = { path = "../liquide-apps-task-manager" }
liquide-apps-software-center = { path = "../liquide-apps-software-center" }
liquide-a11y.workspace = true
liquide-devtools.workspace = true
liquide-message-queue.workspace = true
liquide-render-coordinator.workspace = true
liquide-render-thread.workspace = true
liquide-telemetry-viewer.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
[dev-dependencies]
liquide-compositor = { path = "../liquide-compositor" }
liquide-shell = { path = "../liquide-shell" }
# t52-e4: the e2e tiling test exercises the canonical layout/snap engine
# directly (window-geometry computation is single-sourced onto liquide-tiling).
liquide-tiling = { path = "../liquide-tiling" }
liquide-devtools = { path = "../liquide-devtools" }
liquide-input = { path = "../liquide-input" }
liquide-platform = { path = "../liquide-platform" }
liquide-layout = { path = "../liquide-layout" }
liquide-client-renderer = { path = "../liquide-client-renderer" }