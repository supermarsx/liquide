[package]
name = "liquide-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop client that connects to a Liquide session and renders the remote desktop"

[lib]
name = "liquide_client"
path = "src/lib.rs"

[[bin]]
name = "liquidclient"
path = "src/main.rs"

[dependencies]
liquide-common.workspace = true
liquide-protocol.workspace = true
liquide-transport.workspace = true
liquide-crypto.workspace = true
liquide-client-renderer.workspace = true
liquide-input.workspace = true
liquide-clipboard.workspace = true
liquide-audio.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
dirs.workspace = true
rustls = { workspace = true, features = ["ring"] }
tokio-rustls.workspace = true
webpki-roots.workspace = true
ciborium.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen.workspace = true
