[package]
name = "liquide-renderer-cpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
liquide-common.workspace = true
liquide-compositor.workspace = true
liquide-simd.workspace = true
liquide-font-rasterizer.workspace = true
liquide-paint.workspace = true
liquide-renderer-css.workspace = true
liquide-text-engine.workspace = true
liquide-theme-css.workspace = true
# Full image decoding (PNG/JPEG/GIF/WebP/BMP -> RGBA). Curated feature set
# (no exr/tiff/avif/qoi) to bound compile time per t134 engine plan item 3b;
# `bmp` is built into the crate. default-features OFF so we do not pull the
# heavier codec tree (ravif/rav1e, exr, tiff, qoi).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
miniz_oxide.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "renderer_bench"
harness = false
