# LiquiDE CI Pipeline
# Runs on every pull request and push to main.
# Jobs: lint, build, test, audit
name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: lint-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libpipewire-0.3-dev \
            libpam0g-dev \
            libdbus-1-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libharfbuzz-dev \
            libvulkan-dev \
            libva-dev \
            libssl-dev \
            pkg-config

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: build-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            build-${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-x86_64-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/liquid*
          retention-days: 7

  windows-e2e:
    name: Windows E2E
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry\index\
            ~\.cargo\registry\cache\
            ~\.cargo\git\db\
            target\
          key: windows-e2e-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-e2e-${{ runner.os }}-cargo-

      - name: Check Windows e2e slice
        run: cargo check -p liquide-app-harness -p liquide-platform -p liquide-apps-files -p liquide-apps-settings -p liquide-apps-terminal -p liquide-apps-text-editor -p liquide-apps-software-center -p liquide-apps-task-manager -p liquide-e2e

      - name: Run built-in app launch e2e
        run: cargo test -p liquide-e2e --test windows_app_launch -- --nocapture

      - name: Run scripted input-flow e2e
        run: cargo test -p liquide-e2e --test windows_input_flow -- --nocapture

      - name: Run full workspace smoke e2e
        run: cargo test -p liquide-e2e --test windows_full_workspace_smoke -- --nocapture

      - name: Run shell e2e coverage
        run: cargo test -p liquide-shell --test integration_rendering --test e2e_viewport --test e2e_event_dispatch --test e2e_context_menu --test e2e_font_rendering

      - name: Run session e2e coverage
        run: cargo test -p liquide-session --test e2e_full_integration --test e2e_scene_rendering --test e2e_window_management --test e2e_dock_tracking --test e2e_devtools --test e2e_alignment_tiling

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libpipewire-0.3-dev \
            libpam0g-dev \
            libdbus-1-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libharfbuzz-dev \
            libvulkan-dev \
            libva-dev \
            libssl-dev \
            pkg-config

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --workspace

      - name: Run integration tests
        run: cargo test --workspace --test '*'

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny check
