<!-- LiquiDE StatusBar Component Template
     Three slots: left, center, right.

     IMPORTANT — template-engine contract (t57-f1):
     The liquide-dom template engine is a FLAT renderer: its `{{#if}}` / `{{#each}}`
     handling uses first-match `{{/if}}` / `{{/each}}` scanning and therefore CANNOT
     correctly express NESTED blocks (e.g. the per-item notification/status/tray/
     session dispatch). Earlier versions of this file used 4-deep nested
     `{{#each}}`/`{{#if}}` blocks that the engine truncated at the first `{{/if}}`,
     so the center/right slots collapsed to empty and the real binary showed ONLY
     the LiquiDE logo.

     The per-slot item HTML (including the nested tray structure) is therefore
     assembled in Rust in `shell/dom_sync.rs::sync_statusbar_template` and injected
     verbatim through the three `{{*_items_html}}` raw-HTML placeholders below. Every
     dynamic value is HTML-escaped at its build site in Rust (T49-e5-F06), so the
     structural markup is authored here / there and only the data is escaped.

     This file MUST stay byte-compatible with the embedded SHELL_STATUSBAR_TEMPLATE
     in shell/mod.rs so that the on-disk override and the embedded fallback render
     identically regardless of the working directory / asset layout.

     Item tag names produced into the *_items_html fragments:
       statusbar-item         — generic item (clock, etc.)
       statusbar-logo         — OS logo / branding
       notification-indicator — notification badge
       status-indicator       — connection/status (.connected, .degraded, .disconnected)
       status-tray            — system tray area (with status-tray-item children)
       session-button         — user/session button
-->

<statusbar-slot class="left" id="statusbar-slot-left">
  {{#if show_branding}}
  <statusbar-logo id="logo">{{branding_text}}</statusbar-logo>
  {{/if}}
  {{left_items_html}}
</statusbar-slot>
<statusbar-slot class="center" id="statusbar-slot-center">
  {{center_items_html}}
</statusbar-slot>
<statusbar-slot class="right" id="statusbar-slot-right">
  {{right_items_html}}
</statusbar-slot>
