<!-- LiquiDE App Menu Template
     Window-level application actions menu.
     Instantiated by DesktopDocument::show_app_menu().
     Appended as child of root.

     Each menu-item has data-action for event dispatch.
     Optional data-icon for icon rendering and keyboard shortcut display.
     Separators via <menu-separator>.
-->

<app-menu id="app-menu" role="menu" data-window-id="{{window_id}}" style="left: {{pos_left}}; top: {{pos_top}}">
  {{#each items}}
  {{#if is_separator}}
  <menu-separator />
  {{else}}
  <menu-item role="menuitem" tabindex="{{tab_index}}" aria-selected="{{aria_selected}}" data-action="{{action}}" data-index="{{index}}" {{#if icon}}data-icon="{{icon}}"{{/if}} {{#if selected_class}}class="{{selected_class}}"{{/if}}>
    {{#if icon}}
    <menu-item-icon data-icon="{{icon}}" />
    {{/if}}
    <menu-item-label>{{label}}</menu-item-label>
    {{#if shortcut}}
    <menu-item-shortcut>{{shortcut}}</menu-item-shortcut>
    {{/if}}
  </menu-item>
  {{/if}}
  {{/each}}
</app-menu>
