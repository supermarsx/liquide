<!-- LiquiDE App Menu Template
     Window-level application actions menu. Instantiated by
     DesktopDocument::show_app_menu(), appended as child of root.

     IMPORTANT — template-engine contract (t57-f1):
     The liquide-dom engine is FLAT and cannot express the deeply nested
     {{#each}} -> {{#if is_separator}}{{else}}<menu-item>{{#if icon}}/{{#if shortcut}}
     blocks this file used to carry (the engine mis-parsed them, garbling the
     menu on the real binary). It now uses the single-level
     {{#each items}}{{> menu-item}}{{/each}} form, byte-compatible with the
     embedded DEFAULT_APP_MENU. Per-item markup is the `menu-item` partial; the
     shell supplies each item's `action`, `icon`, and `label`.
-->

<app-menu id="{{id}}" data-window-id="{{window_id}}" style="left: {{pos_left}}; top: {{pos_top}}">
  {{#each items}}{{> menu-item}}{{/each}}
</app-menu>
