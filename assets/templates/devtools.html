<!-- DevTools Panel Template
     Rendered by DevToolsPanel::render_template() — the complete developer tools UI.
     
     Mount point: devtools-panel (created/destroyed based on visibility)
     
     Structure:
       devtools-panel          — outer container, positioned fixed
         devtools-toolbar      — top bar with tab labels + action buttons
           devtools-tabs       — tab label container
             devtools-tab      — individual tab (.active for current)
           devtools-actions    — toolbar button group (right side)
             devtools-btn      — action buttons (close, dock-right, dock-bottom, picker)
         devtools-content      — scrollable content area
           devtools-tab-panel  — one per tab, only .active is visible
             ...tab-specific content elements...
         devtools-statusbar    — bottom status line

     Classes:
       .active     — active tab label / visible tab panel
       .selected   — selected element row in Elements tree
       .hovered    — hovered element row
       .expanded   — expanded tree node (has children visible)
       .collapsed  — collapsed tree node
       .section    — collapsible section header
       .section-open — expanded section
       .dim        — dimmed/inherited text
       .mono       — monospace text
       .tag        — HTML tag name color
       .attr-name  — attribute name color
       .attr-value — attribute value color
       .comment    — comment color
       .ok         — success/green color
       .warn       — warning/yellow color
       .error      — error/red color
       .info       — info/blue color

     Data attributes:
       data-tab    — tab identifier on devtools-tab and devtools-tab-panel
       data-node   — DOM NodeId on element tree rows
       data-action — action identifier on toolbar buttons
       data-depth  — tree depth for indentation
       data-key    — reconciliation key for keyed children

     Theme integration:
       All colors are set via CSS — themes can override devtools appearance
       by targeting devtools-* custom elements.
-->
<devtools-panel id="devtools-panel">
  <!-- Toolbar: tab bar + action buttons -->
  <devtools-toolbar>
    <devtools-tabs>
      <devtools-tab class="active" data-tab="elements" data-key="tab-elements">Elements</devtools-tab>
      <devtools-tab data-tab="styles" data-key="tab-styles">Styles</devtools-tab>
      <devtools-tab data-tab="layout" data-key="tab-layout">Layout</devtools-tab>
      <devtools-tab data-tab="console" data-key="tab-console">Console</devtools-tab>
      <devtools-tab data-tab="scene" data-key="tab-scene">Scene</devtools-tab>
      <devtools-tab data-tab="editor" data-key="tab-editor">Editor</devtools-tab>
      <devtools-tab data-tab="fonts" data-key="tab-fonts">Fonts</devtools-tab>
      <devtools-tab data-tab="anim" data-key="tab-anim">Anim</devtools-tab>
      <devtools-tab data-tab="mutations" data-key="tab-mutations">Mutations</devtools-tab>
      <devtools-tab data-tab="dom" data-key="tab-dom">DOM</devtools-tab>
      <devtools-tab data-tab="files" data-key="tab-files">Files</devtools-tab>
      <devtools-tab data-tab="debug" data-key="tab-debug">Debug</devtools-tab>
    </devtools-tabs>
    <devtools-actions>
      <devtools-btn data-action="picker" data-key="btn-picker">⊕</devtools-btn>
      <devtools-btn data-action="dock-bottom" data-key="btn-dock-bottom">⊥</devtools-btn>
      <devtools-btn data-action="dock-right" data-key="btn-dock-right">⊢</devtools-btn>
      <devtools-btn data-action="close" data-key="btn-close">×</devtools-btn>
    </devtools-actions>
  </devtools-toolbar>

  <!-- Content area: one panel per tab -->
  <devtools-content>
    <!-- Elements tab: DOM tree inspector -->
    <devtools-tab-panel class="active" data-tab="elements">
      <devtools-tree>
        <devtools-tree-row class="expanded" data-node="1" data-depth="0" data-key="node-1">
          <devtools-tree-arrow>▼</devtools-tree-arrow>
          <devtools-tree-tag>&lt;html&gt;</devtools-tree-tag>
        </devtools-tree-row>
      </devtools-tree>
    </devtools-tab-panel>

    <!-- Styles tab: computed CSS properties by category -->
    <devtools-tab-panel data-tab="styles">
      <devtools-style-section class="section section-open" data-key="sec-box">
        <devtools-section-header>Box Model</devtools-section-header>
        <devtools-prop data-key="prop-display">
          <devtools-prop-name>display</devtools-prop-name>
          <devtools-prop-value>block</devtools-prop-value>
        </devtools-prop>
      </devtools-style-section>
    </devtools-tab-panel>

    <!-- Layout tab: box model visualization + layout properties -->
    <devtools-tab-panel data-tab="layout">
      <devtools-box-model>
        <devtools-box-margin>
          <devtools-box-border>
            <devtools-box-padding>
              <devtools-box-content></devtools-box-content>
            </devtools-box-padding>
          </devtools-box-border>
        </devtools-box-margin>
      </devtools-box-model>
      <devtools-layout-props></devtools-layout-props>
    </devtools-tab-panel>

    <!-- Console tab: debug log + input -->
    <devtools-tab-panel data-tab="console">
      <devtools-console-log></devtools-console-log>
      <devtools-console-input>
        <devtools-console-prompt>&gt;</devtools-console-prompt>
        <devtools-console-field></devtools-console-field>
      </devtools-console-input>
    </devtools-tab-panel>

    <!-- Scene Graph tab -->
    <devtools-tab-panel data-tab="scene">
      <devtools-scene-list></devtools-scene-list>
    </devtools-tab-panel>

    <!-- Style Editor tab -->
    <devtools-tab-panel data-tab="editor">
      <devtools-editor-list></devtools-editor-list>
      <devtools-editor-input></devtools-editor-input>
    </devtools-tab-panel>

    <!-- Fonts tab -->
    <devtools-tab-panel data-tab="fonts">
      <devtools-fonts-section></devtools-fonts-section>
    </devtools-tab-panel>

    <!-- Animations tab -->
    <devtools-tab-panel data-tab="anim">
      <devtools-anim-section></devtools-anim-section>
    </devtools-tab-panel>

    <!-- Mutations tab -->
    <devtools-tab-panel data-tab="mutations">
      <devtools-mutations-list></devtools-mutations-list>
    </devtools-tab-panel>

    <!-- DOM Tree tab (JSON export) -->
    <devtools-tab-panel data-tab="dom">
      <devtools-dom-json></devtools-dom-json>
    </devtools-tab-panel>

    <!-- Files tab (Document Overview) -->
    <devtools-tab-panel data-tab="files">
      <devtools-files-section></devtools-files-section>
    </devtools-tab-panel>

    <!-- Debugger tab (Pipeline Metrics) -->
    <devtools-tab-panel data-tab="debug">
      <devtools-debug-section></devtools-debug-section>
    </devtools-tab-panel>
  </devtools-content>

  <!-- Status bar -->
  <devtools-statusbar>
    <devtools-status-text></devtools-status-text>
  </devtools-statusbar>
</devtools-panel>
