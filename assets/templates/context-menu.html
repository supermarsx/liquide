<!-- Context Menu Component Template
     Positioned popup menu. Items can be .disabled.
     Includes separators via <menu-separator>.
     Inline styles set position: left, top.
-->
<context-menu id="ctx-shell">
  <menu-item data-index="0">Copy</menu-item>
  <menu-item data-index="1">Paste</menu-item>
  <menu-separator />
  <menu-item data-index="2" class="disabled">Delete</menu-item>
</context-menu>
