<!-- LiquiDE Dock Component Template
     Rendered by DockComponent -- each dock-item is generated per-app.
     Instantiated as part of the desktop shell.
     Items synced via DesktopDocument::sync_dock_items().

     Data attributes:
       data-app-id — application identifier for launch/focus
       data-icon   — icon name for rendering
       data-label  — display label (tooltip + accessibility)
       data-index  — item index for keyboard navigation

     Classes: .active (running), .pinned (pinned to dock)
     Pseudo-states: :hover on hovered item
-->

{{#each dock_items}}
<dock-item data-app-id="{{app_id}}" data-icon="{{icon}}" data-label="{{label}}" data-index="{{index}}" {{#if classes}}class="{{classes}}"{{/if}} {{#if is_focused}}data-focused="true"{{/if}} {{#if needs_attention}}data-needs-attention="true"{{/if}} {{#if has_badge}}data-badge="{{badge_count}}"{{/if}}>
  <dock-item-icon data-icon="{{icon}}" />
  <dock-item-label>{{label}}</dock-item-label>
  {{#if has_badge}}
  <dock-badge>{{badge_count}}</dock-badge>
  {{/if}}
  {{#if needs_attention}}
  <dock-attention-indicator />
  {{/if}}
  {{#if is_running}}
  <dock-indicator class="running" />
  {{/if}}
</dock-item>
{{/each}}
