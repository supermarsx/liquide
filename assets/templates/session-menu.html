<!-- LiquiDE Session Menu Template
     Power/session actions dropdown.
     Instantiated by DesktopDocument::show_session_menu().
     Appended as child of root.

     Each menu-item has data-action for event dispatch and
     optional data-icon for icon rendering.
     Typical actions: lock, logout, restart, shutdown, suspend.
-->

<session-menu id="{{id}}" style="left: {{pos_left}}; top: {{pos_top}}">
  {{#each items}}
  <menu-item data-action="{{action}}" data-index="{{index}}" {{#if icon}}data-icon="{{icon}}"{{/if}}>
    {{#if icon}}
    <menu-item-icon data-icon="{{icon}}" />
    {{/if}}
    <menu-item-label>{{label}}</menu-item-label>
  </menu-item>
  {{/each}}
</session-menu>
