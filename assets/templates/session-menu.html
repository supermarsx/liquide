<!-- Session Menu Component Template
     Power/session actions menu.
     Each item has data-action and optional data-icon.
-->
<session-menu id="session-menu">
  <menu-item data-action="lock" data-icon="lock">
    <menu-item-icon data-icon="lock" />
    <menu-item-label>Lock</menu-item-label>
  </menu-item>
  <menu-item data-action="logout" data-icon="logout">
    <menu-item-icon data-icon="logout" />
    <menu-item-label>Log Out</menu-item-label>
  </menu-item>
  <menu-item data-action="restart" data-icon="refresh">
    <menu-item-icon data-icon="refresh" />
    <menu-item-label>Restart</menu-item-label>
  </menu-item>
  <menu-item data-action="shutdown" data-icon="power">
    <menu-item-icon data-icon="power" />
    <menu-item-label>Shut Down</menu-item-label>
  </menu-item>
</session-menu>
