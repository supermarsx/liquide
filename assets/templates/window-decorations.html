<!-- LiquiDE Window Decorations Component Template
     CSD (client-side decoration) titlebar with controls.
     Used for app windows that need their own titlebar variant
     (separate from the shell-level window template).

     Classes on window-decoration:
       .maximized  — window is maximized (no border radius)
       .focused    — window has focus
       .unfocused  — window lost focus (dimmed titlebar)

     Titlebar buttons have data-action for event dispatch.
     The titlebar itself is marked as draggable region.
-->

<window-decoration id="{{id}}" class="{{classes}}">
  <titlebar>
    {{#if app_icon}}
    <titlebar-icon data-icon="{{app_icon}}" />
    {{/if}}
    <titlebar-title>{{title}}</titlebar-title>
    <titlebar-spacer />
    <titlebar-controls>
      <titlebar-button data-action="minimize" class="minimize">
        <titlebar-button-icon data-icon="minus" />
      </titlebar-button>
      <titlebar-button data-action="maximize" class="maximize">
        <titlebar-button-icon data-icon="maximize" />
      </titlebar-button>
      <titlebar-button data-action="close" class="close">
        <titlebar-button-icon data-icon="x" />
      </titlebar-button>
    </titlebar-controls>
  </titlebar>
</window-decoration>
