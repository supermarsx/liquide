<!-- LiquiDE Launcher Template
     Full-screen application search/launch overlay.
     Instantiated by DesktopDocument::show_launcher().
     Appended as child of root.

     Structure:
       launcher-overlay (full-screen backdrop)
         launcher (centered card)
           launcher-search (search input)
           launcher-results (scrollable item list)
             launcher-item (per-application entry)

     Data attributes:
       data-app-id  — application identifier for launch
       data-icon    — icon name for rendering
       data-index   — item index for keyboard navigation
       data-query   — current search query on launcher-search

     Classes: .selected (keyboard-highlighted item)
     Pseudo-states: :hover on hovered items
-->

<launcher-overlay id="launcher-overlay" data-state-hash="{{state_hash}}">
  <launcher id="shell-launcher">
    <launcher-search id="launcher-search" data-query="{{query}}">
      <launcher-search-icon data-icon="search" />
      {{#if query}}<launcher-search-text>{{query}}</launcher-search-text>{{else}}<launcher-search-placeholder>Search applications...</launcher-search-placeholder>{{/if}}
    </launcher-search>

    {{#if has_results}}
    <launcher-results>
      {{#each results}}
      <launcher-item data-key="{{key}}" data-app-id="{{app_id}}" data-icon="{{icon}}" data-index="{{index}}" {{#if selected}}class="selected"{{/if}}>
        <launcher-item-icon data-icon="{{icon}}" />
        <launcher-item-label>{{label}}</launcher-item-label>
      </launcher-item>
      {{/each}}
    </launcher-results>
    {{else}}
    <launcher-empty>No results for "{{query}}"</launcher-empty>
    {{/if}}
  </launcher>
</launcher-overlay>
